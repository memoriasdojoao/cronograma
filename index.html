<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Generador de Estudios</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper: #EAECE6;
    --paper-card: #F4F5F1;
    --ink: #23281F;
    --ink-soft: #5B6156;
    --line: #C7CBBE;
    --line-soft: #DBDED3;
    --teal: #2F6F62;
    --teal-dark: #21514A;
    --rust: #B5533C;
    --shadow: 0 1px 2px rgba(35,40,31,0.06), 0 6px 16px rgba(35,40,31,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,40,31,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;
    user-select:none;
  }
  /* nos campos de digitação a seleção de texto continua normal */
  input, textarea{
    -webkit-user-select:text;
    user-select:text;
  }
  h1,h2,h3, .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- HEADER ---------- */
  header.top{
    padding: 28px clamp(16px,4vw,48px) 0;
  }
  .top-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:34px; height:34px; flex-shrink:0; }
  .brand h1{
    font-size: clamp(20px,2.4vw,28px);
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    text-transform:lowercase;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:.03em;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .field input[type=date]{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    background:#fff;
    color:var(--ink);
  }
  .arrow-sep{ color:var(--ink-soft); font-size:13px; margin-top:14px; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  .btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:8px 14px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn-primary, .btn-danger{ margin-top:14px; }
  .btn-primary{
    background:var(--teal);
    border-color:var(--teal-dark);
    color:#fff;
  }
  .btn-primary:hover{ background:var(--teal-dark); }
  .btn-ghost{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-soft);
  }
  .btn-danger{
    background:transparent;
    border:1px solid var(--rust);
    color:var(--rust);
  }
  .btn-danger:hover{ background:rgba(181,83,60,0.08); }

  /* ---------- LAYOUT ---------- */
  main.layout{
    display:flex;
    align-items:flex-start;
    gap:24px;
    padding: 20px clamp(16px,4vw,48px) 60px;
  }
  #calendar-area{
    flex:1 1 auto;
    min-width:0;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    padding-right:8px;
  }
  #sidebar{
    width:300px;
    flex:0 0 300px;
    position:sticky;
    top:20px;
    max-height: calc(100vh - 150px);
    overflow-y:auto;
    padding-right:6px;
  }
  #calendar-area::-webkit-scrollbar, #sidebar::-webkit-scrollbar{ width:8px; }
  #calendar-area::-webkit-scrollbar-track, #sidebar::-webkit-scrollbar-track{ background:transparent; }
  #calendar-area::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  #calendar-area::-webkit-scrollbar-thumb:hover, #sidebar::-webkit-scrollbar-thumb:hover{ background:#b3b7a8; }
  #calendar-area{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  #sidebar{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }

  /* ---------- CALENDAR ---------- */
  .cal-empty{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:48px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .cal-empty b{ display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15px; margin-bottom:6px;}

  #calendar-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(212px,1fr));
    gap:16px;
  }
  .day-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transform:rotate(var(--rot,0deg));
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column;
  }
  .day-card:hover{ transform:rotate(0deg); }
  .day-card.weekend{ background:#EFF1EA; }
  .day-head{
    padding:10px 12px 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px dashed var(--line);
    background-image: linear-gradient(90deg, var(--line-soft) 50%, transparent 0);
    background-size: 8px 1px;
    background-repeat: repeat-x;
    background-position: bottom;
  }
  .day-date{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; letter-spacing:.02em;}
  .day-weekday{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .day-drop{
    flex:1;
    padding:10px;
    min-height:96px;
    display:flex;
    flex-direction:column;
    gap:6px;
    touch-action:manipulation;
  }
  .day-drop.drag-over{ background:rgba(47,111,98,0.08); outline:2px dashed var(--teal); outline-offset:-4px; }
  .day-drop.armed{ background:rgba(47,111,98,0.06); outline:2px dashed var(--teal); outline-offset:-4px; cursor:pointer; }
  .selection-bar{
    display:flex;
    align-items:center;
    gap:10px;
    background:#EAF2EF;
    border:1px solid var(--teal);
    color:var(--teal-dark);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    margin-bottom:16px;
  }
  .selection-bar b{ font-weight:700; }
  .selection-bar .dot{ flex-shrink:0; }
  .selection-bar span.msg{ flex:1; }
  .selection-bar button{
    background:#fff;
    border:1px solid var(--teal);
    color:var(--teal-dark);
    border-radius:6px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    flex-shrink:0;
    touch-action:manipulation;
  }
  .day-placeholder{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    color:#9aa093;
    font-style:italic;
    border:1px dashed var(--line-soft);
    border-radius:6px;
    padding:10px;
  }
  .placed-item{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--tag,#999);
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
    display:flex;
    flex-direction:column;
    gap:1px;
    position:relative;
  }
  .placed-item .placed-subject{ font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .placed-item .placed-topic{ font-weight:600; line-height:1.25; padding-right:14px; }
  .placed-item.highlighted{ border-left-width:6px; }
  .placed-item.highlighted .placed-topic{ font-weight:800; }
  .placed-item button{
    position:absolute; top:4px; right:5px;
    background:none; border:none; color:#b7bcae; font-size:13px; line-height:1;
    padding:2px;
    touch-action:manipulation;
  }
  .placed-item button:hover{ color:var(--rust); }

  /* ---------- SIDEBAR ---------- */
  #sidebar h2{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 4px; }
  #sidebar .hint{ font-size:11px; color:var(--ink-soft); margin:0 0 14px; }
  .subject{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .subject.subject-highlighted{ box-shadow:0 0 0 2px rgba(201,154,46,0.4), var(--shadow); }
  .subject-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 10px;
  }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--tag,#999); flex-shrink:0; }
  .subject-name{ flex:1; font-weight:600; font-size:13px; }
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); font-size:14px; padding:3px 5px; border-radius:5px;
  }
  .icon-btn:hover{ background:var(--line-soft); color:var(--ink); }
  .star-btn.active{ color:#C99A2E; }
  .collapse-btn{ font-size:11px; width:16px; }
  .topic-list{ padding: 0 10px 10px; display:flex; flex-direction:column; gap:6px; }
  .topic-list.collapsed{ display:none; }
  .topic-chip{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--tag,#999);
    border-radius:6px;
    padding:6px 8px;
    font-size:12.5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    transition:box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  .topic-chip.dragging{ opacity:.35; }
  .topic-chip.selected{
    border-color:var(--teal);
    background:#EAF2EF;
    box-shadow:0 0 0 2px rgba(47,111,98,0.28);
  }
  .topic-chip span{ line-height:1.25; }
  .topic-chip button{ background:none; border:none; color:#b7bcae; font-size:13px; flex-shrink:0;}
  .topic-chip button:hover{ color:var(--rust); }
  .add-row{ display:flex; gap:6px; margin-top:2px; }
  .add-row input{
    flex:1; font-family:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:6px 8px;
  }
  .add-row button{
    border:1px solid var(--teal-dark); background:var(--teal); color:#fff; border-radius:6px; font-size:12px; padding:0 10px; font-weight:600;
  }
  .subject-add-topic-btn{
    width:100%;
    text-align:left;
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .subject-add-topic-btn:hover{ border-color:var(--teal); color:var(--teal-dark); }

  #new-subject-box{ margin-top:16px; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding: 10px 20px 40px;
  }

  /* ---------- TOQUE / TABLET (iPad e afins) ----------
     Só entra em ação em dispositivos com ponteiro "grosso" (dedo, sem hover),
     então notebooks com mouse/trackpad continuam exatamente como estão. */
  @media (pointer: coarse){
    /* alvos de toque maiores em botões e ícones */
    .btn{ padding:12px 18px; font-size:14.5px; }
    .field input[type=date]{ padding:10px 12px; font-size:15px; }
    .icon-btn{ padding:9px 11px; font-size:17px; }
    .collapse-btn{ width:26px; font-size:15px; }
    .subject-head{ padding:12px 10px; gap:10px; }

    .topic-chip{ padding:12px 12px; font-size:14.5px; gap:10px; }
    .topic-chip button{ font-size:19px; padding:6px 8px; }
    .subject-add-topic-btn{ padding:12px 12px; font-size:14px; }
    .add-row{ gap:8px; }
    .add-row input{ padding:12px 12px; font-size:14.5px; }
    .add-row button{ padding:0 16px; font-size:14px; }

    #calendar-grid{ grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; }
    .day-drop{ min-height:130px; padding:12px; gap:8px; }
    .day-date{ font-size:15px; }
    .day-weekday{ font-size:11px; }
    .placed-item{ padding:10px 12px; font-size:13.5px; }
    .placed-item .placed-topic{ padding-right:20px; }
    .placed-item button{ font-size:19px; padding:6px 8px; top:2px; right:3px; }

    .selection-bar{ padding:12px 14px; font-size:14px; }
    .selection-bar button{ padding:9px 14px; font-size:13.5px; }

    #new-subject-box .btn{ padding:13px 16px; }
  }

  /* janela estreita com mouse/trackpad (ex: notebook com a janela reduzida) */
  @media (max-width: 820px) and (pointer: fine){
    main.layout{ flex-direction:column; }
    #sidebar{ width:100%; flex-basis:auto; position:static; max-height:none; overflow:visible; }
    #calendar-area{ max-height:none; overflow:visible; }
  }
  /* telas realmente estreitas (celular) — tablets/iPad ficam de fora disso
     e mantêm a barra lateral ao lado, igual ao notebook */
  @media (max-width: 600px){
    main.layout{ flex-direction:column; }
    #sidebar{ width:100%; flex-basis:auto; position:static; max-height:none; overflow:visible; }
    #calendar-area{ max-height:none; overflow:visible; }
  }
  /* ---------- SORTEADOR ---------- */
  #raffle{position:fixed;inset:0;z-index:100;overflow:auto;color:#F4F5F1;-webkit-user-select:none;user-select:none;background:radial-gradient(ellipse at 50% -10%,#3b8576 0%,#173A33 48%,#0C1A17 100%)}
  #raffle[hidden]{display:none}
  #raffle::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(255,246,200,.16) 1px,transparent 0);background-size:38px 38px;animation:rfdrift 40s linear infinite}
  @keyframes rfdrift{to{background-position:380px 380px}}
  .rf-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,48px)}
  .rf-top h2{margin:0;font-size:clamp(18px,2.6vw,26px);letter-spacing:.02em;color:#FFF1B8;text-shadow:0 0 18px rgba(244,214,122,.45)}
  .rf-top button,.rf-actions button{font:600 13px 'IBM Plex Sans',sans-serif;color:#F4F5F1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:10px 14px;transition:background .15s,transform .15s}
  .rf-top button:hover,.rf-actions button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
  .rf-body{position:relative;display:grid;grid-template-columns:340px 1fr;gap:28px;max-width:1280px;margin:0 auto;padding:6px clamp(16px,4vw,48px) 48px}
  .rf-panel{background:rgba(8,20,17,.55);border:1px solid rgba(244,214,122,.28);border-radius:16px;padding:16px;backdrop-filter:blur(6px);align-self:start}
  .rf-panel label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
  .rf-panel small{font-weight:400;color:#b9c9c3}
  #rf-text{width:100%;resize:vertical;min-height:170px;font:14px/1.5 'IBM Plex Sans',sans-serif;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:10px 12px}
  #rf-text:focus{outline:2px solid #C99A2E}
  .rf-actions{display:flex;gap:8px;margin:10px 0}
  .rf-actions #rf-load{background:linear-gradient(180deg,#3b8576,#2F6F62);border-color:#5fb3a2;flex:1}
  .rf-count{font:500 12px 'IBM Plex Mono',monospace;color:#F4D67A;margin-bottom:12px}
  .rf-panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 8px;color:#b9c9c3}
  #rf-history{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  #rf-history li{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.07);animation:rfslide .5s cubic-bezier(.2,1.2,.3,1)}
  #rf-history .n{font:700 11px 'IBM Plex Mono',monospace;color:#3a2a05;background:#F4D67A;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center}
  @keyframes rfslide{from{opacity:0;transform:translateX(-24px) scale(.95)}}
  .rf-stage{display:flex;flex-direction:column;align-items:center;min-width:0}
  .rf-wheelwrap{position:relative;width:100%;display:flex;justify-content:center}
  #rf-canvas{filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));max-width:100%}
  #rf-pointer{position:absolute;top:-4px;left:50%;width:44px;height:58px;margin-left:-22px;transform-origin:50% 12%;background:linear-gradient(90deg,#fff3bd,#E3B93F 45%,#8a6a1c);clip-path:polygon(50% 100%,0 25%,12% 6%,50% 0,88% 6%,100% 25%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));z-index:2}
  #rf-spin{margin-top:22px;font:700 clamp(16px,2vw,20px) 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#3a2a05;background:linear-gradient(180deg,#FBE9A0,#D9A93A);border:0;border-radius:999px;padding:15px 44px;box-shadow:0 6px 0 #8a6a1c,0 14px 34px rgba(244,214,122,.4);animation:rfpulse 2.2s ease-in-out infinite;transition:transform .1s,box-shadow .1s}
  #rf-spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #8a6a1c,0 6px 16px rgba(244,214,122,.4)}
  #rf-spin:disabled{opacity:.5;animation:none;cursor:not-allowed}
  @keyframes rfpulse{50%{box-shadow:0 6px 0 #8a6a1c,0 14px 48px rgba(244,214,122,.75)}}
  #rf-winner{min-height:120px;width:100%;display:flex;justify-content:center}
  .rf-win{margin-top:22px;max-width:100%;padding:18px 30px;border-radius:18px;text-align:center;background:linear-gradient(135deg,rgba(255,246,200,.2),rgba(255,255,255,.05));border:1px solid rgba(244,214,122,.7);animation:rfpop .7s cubic-bezier(.2,1.5,.3,1),rfglow 2.4s ease-in-out .7s infinite}
  .rf-win small{display:block;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#F4D67A;margin-bottom:6px}
  .rf-win strong{font:700 clamp(22px,3.2vw,36px)/1.2 'IBM Plex Mono',monospace;color:#FFF1B8;text-shadow:0 0 22px rgba(244,214,122,.6);overflow-wrap:anywhere}
  @keyframes rfpop{from{opacity:0;transform:scale(.5) rotate(-4deg)}}
  @keyframes rfglow{50%{box-shadow:0 0 44px rgba(244,214,122,.5)}}
  #rf-confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:101}
  @media (max-width:860px){.rf-body{grid-template-columns:1fr}}
  @media (pointer:coarse){.rf-top button,.rf-actions button{padding:13px 16px;font-size:14.5px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="38" height="38" rx="9" fill="#2F6F62"/>
        <line x1="14.5" y1="7.5" x2="14.5" y2="12.5" stroke="#F4F5F1" stroke-width="2.1" stroke-linecap="round"/>
        <line x1="25.5" y1="7.5" x2="25.5" y2="12.5" stroke="#F4F5F1" stroke-width="2.1" stroke-linecap="round"/>
        <rect x="8.5" y="10.5" width="23" height="21" rx="3" stroke="#F4F5F1" stroke-width="2.1"/>
        <line x1="8.5" y1="16.3" x2="31.5" y2="16.3" stroke="#F4F5F1" stroke-width="1.7"/>
        <circle cx="14" cy="21.5" r="1.35" fill="#F4F5F1"/>
        <circle cx="20" cy="21.5" r="1.35" fill="#F4F5F1"/>
        <circle cx="14" cy="26.8" r="1.35" fill="#F4F5F1"/>
        <rect x="17.6" y="24.6" width="6.8" height="6.8" rx="1.6" fill="#C99A2E"/>
      </svg>
      <div>
        <h1>cronograma</h1>
        <div class="sub">planificador de estudios por materia</div>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label for="range-start">desde</label>
        <input type="date" id="range-start">
      </div>
      <span class="arrow-sep">→</span>
      <div class="field">
        <label for="range-end">hasta</label>
        <input type="date" id="range-end">
      </div>
      <button class="btn btn-primary" id="btn-pdf">Generar cronograma (PDF)</button>
      <button class="btn btn-danger" id="btn-clear">Limpiar</button>
      <button class="btn" id="btn-raffle" style="margin-top:14px;border-color:#C99A2E;color:#7a5a12">🎡 Sorteador</button>
    </div>
  </div>
</header>

<main class="layout">
  <section id="calendar-area">
    <div id="calendar-grid"></div>
  </section>

  <aside id="sidebar">
    <h2>Materias</h2>
    <p class="hint">Arrastra un tema al día, o tócalo y luego toca el día para agregarlo.</p>
    <div id="subjects-list"></div>

    <div id="new-subject-box">
      <button class="btn btn-ghost" id="btn-show-new-subject" style="width:100%;">+ nueva materia</button>
      <div class="add-row" id="new-subject-row" hidden style="margin-top:8px;">
        <input type="text" id="new-subject-input" placeholder="Nombre de la materia">
        <button id="btn-confirm-subject">OK</button>
      </div>
    </div>
  </aside>
</main>

<div id="raffle" hidden>
  <div class="rf-top">
    <button id="rf-back">← Volver al cronograma</button>
    <h2>🎡 Sorteador de temas</h2>
    <button id="rf-mute" title="Sonido">🔊</button>
  </div>
  <div class="rf-body">
    <aside class="rf-panel">
      <label for="rf-text">Lista de temas <small>(uno debajo del otro)</small></label>
      <textarea id="rf-text" placeholder="Antiarrítmicos&#10;Insuficiencia cardíaca&#10;Abdomen agudo"></textarea>

      <div class="rf-count" id="rf-count"></div>
      <h3>Ya sorteados</h3>
      <ul id="rf-history"></ul>

      <button id="rf-spin">¡GIRAR!</button>
      <div id="rf-winner" aria-live="polite"></div>
    </section>
  </div>
  <canvas id="rf-confetti"></canvas>
</div>

<footer>hecho para organizar tu rutina de estudio — los datos se guardan solo en este navegador</footer>

<script>
(function(){
  "use strict";

  var PALETTE = ['#2F6F62','#46618C','#C99A2E','#7A5980','#B5533C','#6B7A3A'];
  var WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var STORAGE_KEY = 'cronograma-app-state-v1';

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultState(){
    var s = {
      subjects: [
        { id: uid(), name:'Clínica Médica', color: PALETTE[0], topics:[
          {id:uid(), name:'Antiarrítmicos'},
          {id:uid(), name:'Antagonistas del canal de calcio'},
          {id:uid(), name:'Insuficiencia cardíaca'},
          {id:uid(), name:'Trastornos hidroelectrolíticos'}
        ]},
        { id: uid(), name:'Cirugía General', color: PALETTE[1], topics:[
          {id:uid(), name:'Abdomen agudo'},
          {id:uid(), name:'Hernias de la pared abdominal'},
          {id:uid(), name:'Trauma abdominal'}
        ]},
        { id: uid(), name:'Pediatría', color: PALETTE[2], topics:[
          {id:uid(), name:'Crecimiento y desarrollo'},
          {id:uid(), name:'Ictericia neonatal'},
          {id:uid(), name:'Enfermedades exantemáticas'}
        ]},
        { id: uid(), name:'Ginecología y Obstetricia', color: PALETTE[3], topics:[
          {id:uid(), name:'Sangrado uterino anormal'},
          {id:uid(), name:'Control prenatal de alto riesgo'},
          {id:uid(), name:'Climaterio'}
        ]}
      ],
      rangeStart: isoDate(new Date()),
      rangeEnd: isoDate(addDays(new Date(), 13)),
      schedule: {},
      collapsed: {},
      highlightedSubjectId: null
    };
    return s;
  }

  function isoDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function parseISO(iso){
    var parts = iso.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.subjects) return defaultState();
      if(parsed.highlightedSubjectId === undefined) parsed.highlightedSubjectId = null;
      return parsed;
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function findSubject(id){ return state.subjects.find(function(s){ return s.id===id; }); }

  // seleção transitória para o modo "tocar para agregar" (não é salva em localStorage)
  var selectedTopic = null;

  function addItemToDate(date, payload){
    if(!state.schedule[date]) state.schedule[date] = [];
    state.schedule[date].push({
      id: uid(),
      subjectId: payload.subjectId,
      subjectName: payload.subjectName,
      topicName: payload.topicName,
      color: payload.color
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- RENDER ---------------- */

  function render(){
    renderSubjects();
    renderCalendar();
    save();
  }

  function renderSubjects(){
    var wrap = document.getElementById('subjects-list');
    wrap.innerHTML = '';
    state.subjects.forEach(function(subj){
      var box = document.createElement('div');
      var isHighlighted = state.highlightedSubjectId === subj.id;
      box.className = 'subject' + (isHighlighted ? ' subject-highlighted' : '');
      box.style.setProperty('--tag', subj.color);

      var head = document.createElement('div');
      head.className = 'subject-head';
      var collapsed = !!state.collapsed[subj.id];
      head.innerHTML =
        '<button class="icon-btn collapse-btn" data-action="toggle-subject" data-id="'+subj.id+'">'+(collapsed?'▸':'▾')+'</button>'+
        '<span class="dot"></span>'+
        '<span class="subject-name"></span>'+
        '<button class="icon-btn star-btn'+(isHighlighted?' active':'')+'" data-action="toggle-highlight" data-id="'+subj.id+'" title="'+(isHighlighted?'Quitar destaque':'Destacar en el PDF')+'">'+(isHighlighted?'★':'☆')+'</button>'+
        '<button class="icon-btn" data-action="add-topic-form" data-id="'+subj.id+'" title="Agregar tema">+</button>'+
        '<button class="icon-btn" data-action="delete-subject" data-id="'+subj.id+'" title="Eliminar materia">🗑</button>';
      head.querySelector('.subject-name').textContent = subj.name;
      box.appendChild(head);

      var list = document.createElement('div');
      list.className = 'topic-list' + (collapsed ? ' collapsed' : '');

      subj.topics.forEach(function(t){
        var chip = document.createElement('div');
        chip.className = 'topic-chip' + (selectedTopic && selectedTopic.topicId===t.id ? ' selected' : '');
        chip.draggable = true;
        chip.dataset.subjectId = subj.id;
        chip.dataset.topicId = t.id;
        chip.style.setProperty('--tag', subj.color);
        var span = document.createElement('span');
        span.textContent = t.name;
        var del = document.createElement('button');
        del.textContent = '×';
        del.setAttribute('data-action','delete-topic');
        del.setAttribute('data-subject-id', subj.id);
        del.setAttribute('data-topic-id', t.id);
        chip.appendChild(span);
        chip.appendChild(del);
        list.appendChild(chip);
      });

      var addBtn = document.createElement('button');
      addBtn.className = 'subject-add-topic-btn';
      addBtn.textContent = '+ tema';
      addBtn.setAttribute('data-action','add-topic-form');
      addBtn.setAttribute('data-id', subj.id);
      list.appendChild(addBtn);

      var addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.id = 'add-topic-row-'+subj.id;
      addRow.hidden = true;
      addRow.innerHTML =
        '<input type="text" placeholder="Nuevo tema" id="add-topic-input-'+subj.id+'">'+
        '<button data-action="confirm-add-topic" data-id="'+subj.id+'">OK</button>';
      list.appendChild(addRow);

      box.appendChild(list);
      wrap.appendChild(box);
    });
  }

  function buildSelectionBar(){
    if(!selectedTopic) return null;
    var bar = document.createElement('div');
    bar.className = 'selection-bar';
    bar.innerHTML =
      '<span class="dot" style="--tag:'+selectedTopic.color+'"></span>'+
      '<span class="msg">Tema seleccionado: <b></b> — toca un día para agregarlo</span>'+
      '<button data-action="cancel-selection">Cancelar</button>';
    bar.querySelector('.msg b').textContent = selectedTopic.topicName;
    return bar;
  }

  function renderCalendar(){
    var area = document.getElementById('calendar-area');
    area.innerHTML = '';
    var bar = buildSelectionBar();
    if(bar) area.appendChild(bar);

    if(!state.rangeStart || !state.rangeEnd){
      var empty1 = document.createElement('div');
      empty1.className = 'cal-empty';
      empty1.innerHTML = '<b>define el período</b>Elige la fecha inicial y final arriba para armar el cronograma.';
      area.appendChild(empty1);
      return;
    }
    var start = parseISO(state.rangeStart);
    var end = parseISO(state.rangeEnd);
    if(end < start){
      var empty2 = document.createElement('div');
      empty2.className = 'cal-empty';
      empty2.innerHTML = '<b>período inválido</b>La fecha final debe ser posterior a la fecha inicial.';
      area.appendChild(empty2);
      return;
    }
    var days = [];
    var cur = start;
    var guard = 0;
    while(cur <= end && guard < 400){
      days.push(new Date(cur));
      cur = addDays(cur,1);
      guard++;
    }

    var grid = document.createElement('div');
    grid.id = 'calendar-grid';

    days.forEach(function(d, idx){
      var iso = isoDate(d);
      var card = document.createElement('div');
      card.className = 'day-card' + ((d.getDay()===0||d.getDay()===6) ? ' weekend':'');
      card.style.setProperty('--rot', ((idx%2===0)? '-0.5deg':'0.5deg'));

      var head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML =
        '<span class="day-date">'+String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+'</span>'+
        '<span class="day-weekday">'+WEEKDAYS[d.getDay()]+'</span>';
      card.appendChild(head);

      var drop = document.createElement('div');
      drop.className = 'day-drop' + (selectedTopic ? ' armed' : '');
      drop.dataset.date = iso;

      var items = state.schedule[iso] || [];
      if(items.length===0){
        var ph = document.createElement('div');
        ph.className = 'day-placeholder';
        ph.textContent = 'suelta un tema aquí';
        drop.appendChild(ph);
      } else {
        items.forEach(function(it){
          var isHi = it.subjectId === state.highlightedSubjectId;
          var pi = document.createElement('div');
          pi.className = 'placed-item' + (isHi ? ' highlighted' : '');
          pi.style.setProperty('--tag', it.color);
          if(isHi){ pi.style.background = tintCss(it.color, 0.14); }
          pi.innerHTML =
            '<span class="placed-subject"></span>'+
            '<span class="placed-topic"></span>'+
            '<button data-action="remove-item" data-date="'+iso+'" data-item-id="'+it.id+'">×</button>';
          pi.querySelector('.placed-subject').textContent = (isHi ? '★ ' : '') + it.subjectName;
          pi.querySelector('.placed-topic').textContent = it.topicName;
          drop.appendChild(pi);
        });
      }

      card.appendChild(drop);
      grid.appendChild(card);
    });

    area.appendChild(grid);
  }

  /* ---------------- EVENTS ---------------- */

  document.getElementById('range-start').addEventListener('change', function(e){
    state.rangeStart = e.target.value; render();
  });
  document.getElementById('range-end').addEventListener('change', function(e){
    state.rangeEnd = e.target.value; render();
  });

  document.getElementById('btn-clear').addEventListener('click', function(){
    if(!confirm('¿Vaciar todo el cronograma y reiniciar la fecha de inicio a hoy?')) return;
    var oldStart = state.rangeStart ? parseISO(state.rangeStart) : null;
    var oldEnd = state.rangeEnd ? parseISO(state.rangeEnd) : null;
    var span = 13;
    if(oldStart && oldEnd){
      var diff = Math.round((oldEnd - oldStart) / 86400000);
      if(diff >= 0) span = diff;
    }
    var today = new Date();
    state.schedule = {};
    state.rangeStart = isoDate(today);
    state.rangeEnd = isoDate(addDays(today, span));
    selectedTopic = null;
    document.getElementById('range-start').value = state.rangeStart;
    document.getElementById('range-end').value = state.rangeEnd;
    render();
  });

  document.getElementById('btn-show-new-subject').addEventListener('click', function(){
    document.getElementById('new-subject-row').hidden = false;
    document.getElementById('new-subject-input').focus();
  });
  document.getElementById('btn-confirm-subject').addEventListener('click', addSubjectFromInput);
  document.getElementById('new-subject-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') addSubjectFromInput();
  });
  function addSubjectFromInput(){
    var input = document.getElementById('new-subject-input');
    var name = input.value.trim();
    if(!name) return;
    var color = PALETTE[state.subjects.length % PALETTE.length];
    state.subjects.push({id:uid(), name:name, color:color, topics:[]});
    input.value='';
    document.getElementById('new-subject-row').hidden = true;
    render();
  }

  // delegated clicks
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(btn){
      var action = btn.getAttribute('data-action');

      if(action === 'toggle-subject'){
        var id = btn.dataset.id;
        state.collapsed[id] = !state.collapsed[id];
        render();
      }
      else if(action === 'delete-subject'){
        var id = btn.dataset.id;
        if(confirm('¿Eliminar esta materia y todos sus temas?')){
          if(selectedTopic && selectedTopic.subjectId===id) selectedTopic = null;
          if(state.highlightedSubjectId === id) state.highlightedSubjectId = null;
          state.subjects = state.subjects.filter(function(s){ return s.id!==id; });
          render();
        }
      }
      else if(action === 'add-topic-form'){
        var id = btn.dataset.id;
        var row = document.getElementById('add-topic-row-'+id);
        if(row){ row.hidden = false; document.getElementById('add-topic-input-'+id).focus(); }
      }
      else if(action === 'confirm-add-topic'){
        var id = btn.dataset.id;
        var input = document.getElementById('add-topic-input-'+id);
        var name = input.value.trim();
        if(name){
          var subj = findSubject(id);
          subj.topics.push({id:uid(), name:name});
          render();
        }
      }
      else if(action === 'delete-topic'){
        var sid = btn.dataset.subjectId, tid = btn.dataset.topicId;
        if(selectedTopic && selectedTopic.topicId===tid) selectedTopic = null;
        var subj = findSubject(sid);
        subj.topics = subj.topics.filter(function(t){ return t.id!==tid; });
        render();
      }
      else if(action === 'remove-item'){
        var date = btn.dataset.date, itemId = btn.dataset.itemId;
        if(state.schedule[date]){
          state.schedule[date] = state.schedule[date].filter(function(it){ return it.id!==itemId; });
        }
        render();
      }
      else if(action === 'cancel-selection'){
        selectedTopic = null;
        render();
      }
      else if(action === 'toggle-highlight'){
        var hid = btn.dataset.id;
        state.highlightedSubjectId = (state.highlightedSubjectId === hid) ? null : hid;
        render();
      }
      return;
    }

    // toca en un chip: seleccionarlo (o deseleccionarlo si ya estaba activo)
    var chip = e.target.closest('.topic-chip');
    if(chip){
      var csid = chip.dataset.subjectId, ctid = chip.dataset.topicId;
      var csubj = findSubject(csid);
      var ctopic = csubj && csubj.topics.find(function(t){ return t.id===ctid; });
      if(!ctopic) return;
      if(selectedTopic && selectedTopic.topicId===ctid){
        selectedTopic = null;
      } else {
        selectedTopic = { subjectId:csid, subjectName:csubj.name, topicId:ctid, topicName:ctopic.name, color:csubj.color };
      }
      render();
      return;
    }

    // toca en un día con un tema seleccionado: lo agrega a ese día
    var dropZone = e.target.closest('.day-drop');
    if(dropZone && selectedTopic){
      addItemToDate(dropZone.dataset.date, selectedTopic);
      render();
      return;
    }
  });

  // enter key inside dynamic topic inputs (delegated)
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.tagName==='INPUT' && e.target.id.indexOf('add-topic-input-')===0){
      var id = e.target.id.replace('add-topic-input-','');
      var subj = findSubject(id);
      var name = e.target.value.trim();
      if(name){ subj.topics.push({id:uid(), name:name}); render(); }
    }
  });

  // drag and drop
  document.addEventListener('dragstart', function(e){
    var chip = e.target.closest('.topic-chip');
    if(!chip) return;
    selectedTopic = null; // um modo de cada vez: arrastar cancela a seleção por toque
    var sid = chip.dataset.subjectId, tid = chip.dataset.topicId;
    var subj = findSubject(sid);
    var topic = subj.topics.find(function(t){ return t.id===tid; });
    if(!topic) return;
    var payload = { subjectId: sid, subjectName: subj.name, topicId: tid, topicName: topic.name, color: subj.color };
    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'copy';
    chip.classList.add('dragging');
  });
  document.addEventListener('dragend', function(e){
    var chip = e.target.closest('.topic-chip');
    if(chip) chip.classList.remove('dragging');
  });
  document.addEventListener('dragover', function(e){
    var drop = e.target.closest('.day-drop');
    if(!drop) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    drop.classList.add('drag-over');
  });
  document.addEventListener('dragleave', function(e){
    var drop = e.target.closest('.day-drop');
    if(drop) drop.classList.remove('drag-over');
  });
  document.addEventListener('drop', function(e){
    var drop = e.target.closest('.day-drop');
    if(!drop) return;
    e.preventDefault();
    drop.classList.remove('drag-over');
    var raw = e.dataTransfer.getData('text/plain');
    if(!raw) return;
    var payload;
    try{ payload = JSON.parse(raw); }catch(err){ return; }
    addItemToDate(drop.dataset.date, payload);
    render();
  });

  /* ---------------- PDF ---------------- */

  function hexToRgb(hex){
    var v = hex.replace('#','');
    return [parseInt(v.substring(0,2),16), parseInt(v.substring(2,4),16), parseInt(v.substring(4,6),16)];
  }

  function tintRgb(rgb, alpha){
    return [
      Math.round(rgb[0]*alpha + 255*(1-alpha)),
      Math.round(rgb[1]*alpha + 255*(1-alpha)),
      Math.round(rgb[2]*alpha + 255*(1-alpha))
    ];
  }

  function tintCss(hex, alpha){
    var rgb = tintRgb(hexToRgb(hex), alpha);
    return 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
  }

  // builds an array of weeks (Sun..Sat), each a list of {date|null} covering the full range,
  // padded at both ends so every week has 7 slots, like the on-screen grid but organized by week.
  function buildWeeks(start, end){
    var firstSunday = addDays(start, -start.getDay());
    var lastSaturday = addDays(end, 6 - end.getDay());
    var weeks = [];
    var cur = new Date(firstSunday);
    while(cur <= lastSaturday){
      var week = [];
      for(var i=0;i<7;i++){
        var inRange = cur >= start && cur <= end;
        week.push(inRange ? new Date(cur) : null);
        cur = addDays(cur,1);
      }
      weeks.push(week);
    }
    return weeks;
  }

  document.getElementById('btn-pdf').addEventListener('click', function(){
    if(!state.rangeStart || !state.rangeEnd){ alert('Define el período del cronograma antes de generar el PDF.'); return; }
    var start = parseISO(state.rangeStart), end = parseISO(state.rangeEnd);
    if(end < start){ alert('Período inválido.'); return; }

    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor){ alert('No se pudo cargar el generador de PDF. Verifica tu conexión a internet.'); return; }

    var doc = new jsPDFCtor({ unit:'pt', format:'a4', orientation:'landscape' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 34;
    var fmt = function(d){ return String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); };

    var colGap = 6;
    var colW = (pageW - margin*2 - colGap*6) / 7;
    var headerH = 16;

    // texto de cada item se envuelve en varias líneas (sin recortar con "…"),
    // así que la altura de cada tarjeta y de cada fila se calcula según el contenido.
    var chipPadTop = 5, chipPadBottom = 5, chipGap = 4;
    var subjFontSize = 5.8, subjLineH = 6.2;
    var topicFontSizeN = 7.6, topicLineHN = 8.7;
    var topicFontSizeHi = 8.3, topicLineHHi = 9.6;
    var subjColor = [140,145,133];
    var topicColor = [35,40,31];

    function buildItemLines(item, maxW){
      var isHi = item.subjectId === state.highlightedSubjectId;
      doc.setFont('helvetica','normal');
      doc.setFontSize(subjFontSize);
      var subjTexts = doc.splitTextToSize(item.subjectName.toUpperCase(), maxW);

      var topicSize = isHi ? topicFontSizeHi : topicFontSizeN;
      var topicLH = isHi ? topicLineHHi : topicLineHN;
      doc.setFont('helvetica','bold');
      doc.setFontSize(topicSize);
      var topicTexts = doc.splitTextToSize(item.topicName, maxW);

      var lines = [];
      subjTexts.forEach(function(t){ lines.push({text:t, font:'normal', size:subjFontSize, color:subjColor, lh:subjLineH}); });
      topicTexts.forEach(function(t){ lines.push({text:t, font:'bold', size:topicSize, color:topicColor, lh:topicLH}); });

      var height = chipPadTop + lines.reduce(function(s,l){ return s+l.lh; }, 0) + chipPadBottom;
      return { isHi:isHi, lines:lines, height:height };
    }

    function dayItemsTotalHeight(items, maxW){
      var total = 0;
      items.forEach(function(it){ total += buildItemLines(it, maxW).height + chipGap; });
      return total;
    }

    function computeRowHeight(week){
      var chipW = colW - 8;
      var textMaxW = chipW - 12;
      var maxTotal = 0;
      week.forEach(function(d){
        if(!d) return;
        var items = state.schedule[isoDate(d)] || [];
        var total = dayItemsTotalHeight(items, textMaxW);
        if(total > maxTotal) maxTotal = total;
      });
      var minRowH = 70;
      return Math.max(minRowH, headerH + 8 + maxTotal + 8);
    }

    var weeks = buildWeeks(start, end);

    function drawTitleBlock(){
      var y = margin + 4;
      doc.setFont('helvetica','bold');
      doc.setFontSize(17);
      doc.setTextColor(35,40,31);
      doc.text('Cronograma de Estudios', margin, y);

      doc.setFont('helvetica','normal');
      doc.setFontSize(10);
      doc.setTextColor(90,96,86);
      doc.text(fmt(start) + '  —  ' + fmt(end), pageW - margin, y, {align:'right'});
      y += 16;

      // legend
      doc.setFontSize(8.5);
      var lx = margin;
      state.subjects.forEach(function(s){
        var isHi = s.id === state.highlightedSubjectId;
        var label = s.name + (isHi ? ' (destacada)' : '');
        var rgb = hexToRgb(s.color);
        doc.setFont('helvetica', isHi ? 'bold' : 'normal');
        var w = doc.getTextWidth(label) + 16;
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.roundedRect(lx, y-7, 7, 7, 2, 2, 'F');
        doc.setTextColor(35,40,31);
        doc.text(label, lx + 11, y);
        lx += w + 8;
      });
      y += 12;
      return y + 10;
    }

    function drawWeekdayHeader(y){
      var labels = ['dom','lun','mar','mié','jue','vie','sáb'];
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      doc.setTextColor(120,126,112);
      for(var i=0;i<7;i++){
        var x = margin + i*(colW+colGap);
        doc.text(labels[i].toUpperCase(), x + 5, y);
      }
      return y + 8;
    }

    function drawWeekRow(week, y, rowH){
      for(var i=0;i<7;i++){
        var x = margin + i*(colW+colGap);
        var d = week[i];
        var isWeekend = (i===0 || i===6);

        // cell background
        if(!d){
          doc.setFillColor(238,238,233);
          doc.roundedRect(x, y, colW, rowH, 4, 4, 'F');
          continue;
        }
        doc.setFillColor(isWeekend ? 239 : 244, isWeekend ? 241 : 245, isWeekend ? 234 : 241);
        doc.roundedRect(x, y, colW, rowH, 4, 4, 'F');
        doc.setDrawColor(199,203,190);
        doc.setLineWidth(0.6);
        doc.roundedRect(x, y, colW, rowH, 4, 4, 'S');

        // date header
        doc.setFont('helvetica','bold');
        doc.setFontSize(9.5);
        doc.setTextColor(35,40,31);
        doc.text(String(d.getDate()).padStart(2,'0') + ' ' + MONTHS[d.getMonth()], x + 6, y + 14);

        // dashed divider
        doc.setDrawColor(210,213,201);
        doc.setLineDashPattern([1.5,1.5], 0);
        doc.line(x+4, y+headerH+3, x+colW-4, y+headerH+3);
        doc.setLineDashPattern([], 0);

        // items (texto completo, sin recortar — cada tarjeta crece según haga falta)
        var iso = isoDate(d);
        var items = state.schedule[iso] || [];
        var iy = y + headerH + 8;
        var chipX = x + 4;
        var chipW = colW - 8;
        var textMaxW = chipW - 12;

        items.forEach(function(it){
          var info = buildItemLines(it, textMaxW);
          var rgb = hexToRgb(it.color);

          if(info.isHi){
            var tint = tintRgb(rgb, 0.22);
            doc.setFillColor(tint[0], tint[1], tint[2]);
          } else {
            doc.setFillColor(255,255,255);
          }
          doc.roundedRect(chipX, iy, chipW, info.height, 2.5, 2.5, 'F');

          if(info.isHi){ doc.setDrawColor(rgb[0], rgb[1], rgb[2]); doc.setLineWidth(1); }
          else { doc.setDrawColor(216,219,209); doc.setLineWidth(0.5); }
          doc.roundedRect(chipX, iy, chipW, info.height, 2.5, 2.5, 'S');

          // colored left bar
          doc.setFillColor(rgb[0], rgb[1], rgb[2]);
          doc.rect(chipX + 0.3, iy + 0.3, info.isHi ? 4 : 3, info.height - 0.6, 'F');

          var textX = chipX + (info.isHi ? 9 : 8);
          var cursor = iy + chipPadTop;
          info.lines.forEach(function(line){
            cursor += line.lh;
            doc.setFont('helvetica', line.font);
            doc.setFontSize(line.size);
            doc.setTextColor(line.color[0], line.color[1], line.color[2]);
            doc.text(line.text, textX, cursor - line.lh*0.28);
          });

          iy += info.height + chipGap;
        });
      }
    }

    var y = drawTitleBlock();
    y = drawWeekdayHeader(y);

    weeks.forEach(function(week){
      var rowH = computeRowHeight(week);
      if(y + rowH > pageH - margin){
        doc.addPage();
        y = margin + 6;
        y = drawWeekdayHeader(y);
      }
      drawWeekRow(week, y, rowH);
      y += rowH + 8;
    });

    var fname = 'cronograma_' + state.rangeStart + '_a_' + state.rangeEnd + '.pdf';
    doc.save(fname);
  });

  /* ---------------- SORTEADOR ---------------- */
  (function(){
    var KEY='cronograma-raffle-v1', TAU=Math.PI*2;
    var rf={all:[],items:[],drawn:[],text:'',muted:false,rot:0,busy:false};
    try{ var sv=JSON.parse(localStorage.getItem(KEY)); if(sv&&sv.items){ rf.all=sv.all||[]; rf.items=sv.items; rf.drawn=sv.drawn||[]; rf.text=sv.text||''; rf.muted=!!sv.muted; } }catch(e){}
    function save2(){ try{ localStorage.setItem(KEY,JSON.stringify({all:rf.all,items:rf.items,drawn:rf.drawn,text:rf.text,muted:rf.muted})); }catch(e){} }
    var $=function(id){ return document.getElementById(id); };
    var root=$('raffle'), cv=$('rf-canvas'), cx=cv.getContext('2d'), ptr=$('rf-pointer'), size=520, open=false, anim=null, flick=0, lastIdx=0, fade=0;

    function tick(sp){ var a=audio(); if(!a) return; tone(480+sp*760,a.currentTime,0.055,'triangle',0.2); tone(2200,a.currentTime,0.012,'square',0.04); }
    function whoosh(){ var a=audio(); if(!a||rf.muted) return; var n=a.sampleRate*1.3, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(var i=0;i<n;i++) d[i]=Math.random()*2-1; var s=a.createBufferSource(); s.buffer=b; var f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; var t=a.currentTime; f.frequency.setValueAtTime(250,t); f.frequency.exponentialRampToValueAtTime(3200,t+1); var g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+1.3); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }
    function fanfare(){ var a=audio(); if(!a) return; var t=a.currentTime; [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){ tone(f,t+i*0.11,0.6,'triangle',0.22); tone(f*2,t+i*0.11,0.45,'sine',0.07); }); tone(130.8,t,1.3,'sawtooth',0.06); tone(1567.98,t+0.6,0.9,'sine',0.1); }

    /* ---- ruleta ---- */
    function col(i,n){ return COLORS[(i+((i===n-1&&n>1&&i%COLORS.length===0)?3:0))%COLORS.length]; }
    function idxAt(rot){ var n=rf.items.length, seg=TAU/n; return Math.floor((((-Math.PI/2-rot)%TAU)+TAU)%TAU/seg)%n; }
    function draw(time){
      var dpr=window.devicePixelRatio||1, S=size; if(cv.width!==S*dpr){ cv.width=S*dpr; cv.height=S*dpr; cv.style.width=S+'px'; cv.style.height=S+'px'; }
      cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,S,S);
      var c=S/2, R=c-8, rim=S*0.055, r=R-rim, n=rf.items.length;
      var g=cx.createLinearGradient(0,0,S,S); g.addColorStop(0,'#FBE9A0'); g.addColorStop(.45,'#C99A2E'); g.addColorStop(1,'#7A5A12');

      if(!n){ cx.beginPath(); cx.arc(c,c,r,0,TAU); cx.fillStyle='#14251f'; cx.fill(); cx.fillStyle='#b9c9c3'; cx.textAlign='center'; cx.font='600 '+Math.round(S/24)+'px "IBM Plex Sans",sans-serif'; cx.fillText(rf.all.length?'¡Todos sorteados!':'Agrega tus temas',c,c-4); cx.font='400 '+Math.round(S/32)+'px "IBM Plex Sans",sans-serif'; cx.fillText(rf.all.length?'Pulsa Reiniciar para volver a empezar':'y pulsa “Cargar en la ruleta”',c,c+S/22); }
      else {
        var seg=TAU/n, fs=Math.max(9,Math.min(19,(TAU*r*0.5/n)*0.85));
        for(var i=0;i<n;i++){
          var a0=rf.rot+i*seg, a1=a0+seg;
          cx.beginPath(); cx.moveTo(c,c); cx.arc(c,c,r,a0,a1); cx.closePath(); cx.fillStyle=col(i,n); cx.fill();
          var sh=cx.createRadialGradient(c,c,r*0.1,c,c,r); sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(1,'rgba(0,0,0,.22)'); cx.fillStyle=sh; cx.fill();
          cx.lineWidth=1.5; cx.strokeStyle='rgba(255,255,255,.4)'; cx.stroke();
          if(n<=40){ cx.save(); cx.translate(c,c); cx.rotate(a0+seg/2); cx.textAlign='right'; cx.fillStyle='#fff'; cx.shadowColor='rgba(0,0,0,.45)'; cx.shadowBlur=3; cx.font='600 '+fs+'px "IBM Plex Sans",sans-serif'; var t=rf.items[i], mw=r*0.68; if(cx.measureText(t).width>mw){ while(t.length>1&&cx.measureText(t+'…').width>mw) t=t.slice(0,-1); t+='…'; } cx.fillText(t,r-16,fs*0.35); cx.restore(); }
        }
      }
      var gl=cx.createRadialGradient(c-r*.35,c-r*.4,r*.05,c,c,r); gl.addColorStop(0,'rgba(255,255,255,.22)'); gl.addColorStop(.5,'rgba(255,255,255,0)'); cx.beginPath(); cx.arc(c,c,r,0,TAU); cx.fillStyle=gl; cx.fill();
      var bulbs=28, step=Math.floor(time/(anim?90:420));
      for(var k=0;k<bulbs;k++){ var an=k/bulbs*TAU, on=((k+step)%2===0), bx=c+Math.cos(an)*(R-rim/2), by=c+Math.sin(an)*(R-rim/2); cx.beginPath(); cx.arc(bx,by,rim*0.26,0,TAU); cx.shadowColor=on?'#FFF3B0':'transparent'; cx.shadowBlur=on?14:0; cx.fillStyle=on?'#FFFBE0':'#8a6a1c'; cx.fill(); cx.shadowBlur=0; }
      var hg=cx.createRadialGradient(c-6,c-6,2,c,c,S*0.06); hg.addColorStop(0,'#FFF6C8'); hg.addColorStop(1,'#B8861F');
      cx.beginPath(); cx.arc(c,c,S*0.06,0,TAU); cx.fillStyle=hg; cx.shadowColor='rgba(0,0,0,.5)'; cx.shadowBlur=10; cx.fill(); cx.shadowBlur=0;
      cx.fillStyle='#173A33'; cx.font='700 '+Math.round(S*0.05)+'px sans-serif'; cx.textAlign='center'; cx.fillText('★',c,c+S*0.018);
    }
    function loop(now){
      if(!open) return;
      if(anim){
        var p=Math.min(1,(now-anim.t0)/anim.dur), e=1-Math.pow(1-p,4);
        rf.rot=anim.start+(anim.target-anim.start)*e;

      var n=rf.items.length, seg=TAU/n, w=Math.floor(rnd01()*n), f=0.12+rnd01()*0.76;

    }
    function finish(w){
      var name=rf.items[w]; fanfare(); confetti();
      var box=$('rf-winner'); box.innerHTML='<div class="rf-win"><small>Tema sorteado · n.º '+(rf.drawn.length+1)+'</small><strong></strong></div>'; box.querySelector('strong').textContent=name;
      setTimeout(function(){ rf.items.splice(w,1); rf.drawn.push(name); rf.rot=rf.rot%TAU; rf.busy=false; save2(); panel(); }, 1500);
    }
    function panel(){
      $('rf-count').textContent=rf.items.length+' en la ruleta · '+rf.drawn.length+' sorteados';
      var ul=$('rf-history'); ul.innerHTML='';
      for(var i=rf.drawn.length-1;i>=0;i--){ var li=document.createElement('li'); li.innerHTML='<span class="n"></span><span></span>'; li.children[0].textContent=i+1; li.children[1].textContent=rf.drawn[i]; ul.appendChild(li); }
      var b=$('rf-spin'); b.disabled=rf.busy||!rf.items.length; b.textContent=rf.items.length?'¡GIRAR!':'SIN TEMAS';
    }

    /* ---- confeti ---- */
    var cf=$('rf-confetti'), cfx=cf.getContext('2d'), parts=[], cfRun=false;
    function confetti(){
      cf.width=innerWidth; cf.height=innerHeight; var r=cv.getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height/2;
      for(var i=0;i<170;i++){ var a=-Math.PI/2+(Math.random()-.5)*2.2, v=8+Math.random()*13; parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*5,rot:Math.random()*TAU,vr:(Math.random()-.5)*.35,c:COLORS[i%COLORS.length],o:1}); }
      if(!cfRun){ cfRun=true; requestAnimationFrame(cfLoop); }
    }
    function cfLoop(){
      cfx.clearRect(0,0,cf.width,cf.height);
      parts=parts.filter(function(p){ return p.o>0.02&&p.y<cf.height+30; });
      parts.forEach(function(p){ p.vy+=0.32; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; if(p.vy>6) p.o-=0.012; cfx.save(); cfx.globalAlpha=Math.max(0,p.o); cfx.translate(p.x,p.y); cfx.rotate(p.rot); cfx.fillStyle=p.c; cfx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cfx.restore(); });

    function openR(){ root.hidden=false; document.body.style.overflow='hidden'; $('rf-text').value=rf.text; $('rf-mute').textContent=rf.muted?'🔇':'🔊'; open=true; fit(); panel(); requestAnimationFrame(loop); }
    function closeR(){ open=false; root.hidden=true; document.body.style.overflow=''; }
    $('btn-raffle').addEventListener('click',openR);
    $('rf-back').addEventListener('click',closeR);
    document.addEventListener('keydown',function(e){ if(open&&e.key==='Escape') closeR(); });
    window.addEventListener('resize',function(){ if(open) fit(); });
    $('rf-spin').addEventListener('click',function(){ audio(); spin(); });
    $('rf-mute').addEventListener('click',function(){ rf.muted=!rf.muted; this.textContent=rf.muted?'🔇':'🔊'; save2(); });
    $('rf-text').addEventListener('input',function(){ rf.text=this.value; save2(); });

      if(rf.busy) return; rf.text=$('rf-text').value;
      rf.all=rf.text.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);

    });

      if(rf.busy) return; rf.items=rf.all.slice(); rf.drawn=[]; $('rf-winner').innerHTML=''; save2(); panel();
    });
  })();

  /* ---------------- INIT ---------------- */

  document.getElementById('range-start').value = state.rangeStart || '';
  document.getElementById('range-end').value = state.rangeEnd || '';
  render();

})();
