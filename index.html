<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Generador de Estudios</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper: #EAECE6;
    --paper-card: #F4F5F1;
    --ink: #23281F;
    --ink-soft: #5B6156;
    --line: #C7CBBE;
    --line-soft: #DBDED3;
    --teal: #2F6F62;
    --teal-dark: #21514A;
    --rust: #B5533C;
    --shadow: 0 1px 2px rgba(35,40,31,0.06), 0 6px 16px rgba(35,40,31,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,40,31,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- HEADER ---------- */
  header.top{
    padding: 28px clamp(16px,4vw,48px) 0;
  }
  .top-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:34px; height:34px; flex-shrink:0; }
  .brand h1{
    font-size: clamp(20px,2.4vw,28px);
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    text-transform:lowercase;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:.03em;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    box-shadow:var(--shadow);
  }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .field input[type=date]{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    background:#fff;
    color:var(--ink);
  }
  .arrow-sep{ color:var(--ink-soft); font-size:13px; margin-top:14px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:8px 14px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn-primary{
    background:var(--teal);
    border-color:var(--teal-dark);
    color:#fff;
    margin-top:14px;
  }
  .btn-primary:hover{ background:var(--teal-dark); }
  .btn-ghost{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-soft);
  }

  /* ---------- LAYOUT ---------- */
  main.layout{
    display:flex;
    align-items:flex-start;
    gap:24px;
    padding: 20px clamp(16px,4vw,48px) 60px;
  }
  #calendar-area{ flex:1 1 auto; min-width:0; }
  #sidebar{
    width:300px;
    flex:0 0 300px;
    position:sticky;
    top:20px;
  }

  /* ---------- CALENDAR ---------- */
  .cal-empty{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:48px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .cal-empty b{ display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15px; margin-bottom:6px;}

  #calendar-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(212px,1fr));
    gap:16px;
  }
  .day-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transform:rotate(var(--rot,0deg));
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column;
  }
  .day-card:hover{ transform:rotate(0deg); }
  .day-card.weekend{ background:#EFF1EA; }
  .day-head{
    padding:10px 12px 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px dashed var(--line);
    background-image: linear-gradient(90deg, var(--line-soft) 50%, transparent 0);
    background-size: 8px 1px;
    background-repeat: repeat-x;
    background-position: bottom;
  }
  .day-date{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; letter-spacing:.02em;}
  .day-weekday{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .day-drop{
    flex:1;
    padding:10px;
    min-height:96px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .day-drop.drag-over{ background:rgba(47,111,98,0.08); outline:2px dashed var(--teal); outline-offset:-4px; }
  .day-placeholder{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    color:#9aa093;
    font-style:italic;
    border:1px dashed var(--line-soft);
    border-radius:6px;
    padding:10px;
  }
  .placed-item{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--tag,#999);
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
    display:flex;
    flex-direction:column;
    gap:1px;
    position:relative;
  }
  .placed-item .placed-subject{ font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .placed-item .placed-topic{ font-weight:600; line-height:1.25; padding-right:14px; }
  .placed-item button{
    position:absolute; top:4px; right:5px;
    background:none; border:none; color:#b7bcae; font-size:13px; line-height:1;
    padding:2px;
  }
  .placed-item button:hover{ color:var(--rust); }

  /* ---------- SIDEBAR ---------- */
  #sidebar h2{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 4px; }
  #sidebar .hint{ font-size:11px; color:var(--ink-soft); margin:0 0 14px; }
  .subject{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .subject-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 10px;
  }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--tag,#999); flex-shrink:0; }
  .subject-name{ flex:1; font-weight:600; font-size:13px; }
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); font-size:14px; padding:3px 5px; border-radius:5px;
  }
  .icon-btn:hover{ background:var(--line-soft); color:var(--ink); }
  .collapse-btn{ font-size:11px; width:16px; }
  .topic-list{ padding: 0 10px 10px; display:flex; flex-direction:column; gap:6px; }
  .topic-list.collapsed{ display:none; }
  .topic-chip{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--tag,#999);
    border-radius:6px;
    padding:6px 8px;
    font-size:12.5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    cursor:grab;
  }
  .topic-chip.dragging{ opacity:.35; }
  .topic-chip span{ line-height:1.25; }
  .topic-chip button{ background:none; border:none; color:#b7bcae; font-size:13px; flex-shrink:0;}
  .topic-chip button:hover{ color:var(--rust); }
  .add-row{ display:flex; gap:6px; margin-top:2px; }
  .add-row input{
    flex:1; font-family:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:6px 8px;
  }
  .add-row button{
    border:1px solid var(--teal-dark); background:var(--teal); color:#fff; border-radius:6px; font-size:12px; padding:0 10px; font-weight:600;
  }
  .subject-add-topic-btn{
    width:100%;
    text-align:left;
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .subject-add-topic-btn:hover{ border-color:var(--teal); color:var(--teal-dark); }

  #new-subject-box{ margin-top:16px; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding: 10px 20px 40px;
  }

  @media (max-width: 820px){
    main.layout{ flex-direction:column; }
    #sidebar{ width:100%; flex-basis:auto; position:static; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="38" height="38" rx="9" fill="#2F6F62"/>
        <line x1="14.5" y1="7.5" x2="14.5" y2="12.5" stroke="#F4F5F1" stroke-width="2.1" stroke-linecap="round"/>
        <line x1="25.5" y1="7.5" x2="25.5" y2="12.5" stroke="#F4F5F1" stroke-width="2.1" stroke-linecap="round"/>
        <rect x="8.5" y="10.5" width="23" height="21" rx="3" stroke="#F4F5F1" stroke-width="2.1"/>
        <line x1="8.5" y1="16.3" x2="31.5" y2="16.3" stroke="#F4F5F1" stroke-width="1.7"/>
        <circle cx="14" cy="21.5" r="1.35" fill="#F4F5F1"/>
        <circle cx="20" cy="21.5" r="1.35" fill="#F4F5F1"/>
        <circle cx="14" cy="26.8" r="1.35" fill="#F4F5F1"/>
        <rect x="17.6" y="24.6" width="6.8" height="6.8" rx="1.6" fill="#C99A2E"/>
      </svg>
      <div>
        <h1>cronograma</h1>
        <div class="sub">planificador de estudios por materia</div>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label for="range-start">desde</label>
        <input type="date" id="range-start">
      </div>
      <span class="arrow-sep">→</span>
      <div class="field">
        <label for="range-end">hasta</label>
        <input type="date" id="range-end">
      </div>
      <button class="btn btn-primary" id="btn-pdf">Generar cronograma (PDF)</button>
    </div>
  </div>
</header>

<main class="layout">
  <section id="calendar-area">
    <div id="calendar-grid"></div>
  </section>

  <aside id="sidebar">
    <h2>Materias</h2>
    <p class="hint">Arrastra un tema al día deseado en el cronograma.</p>
    <div id="subjects-list"></div>

    <div id="new-subject-box">
      <button class="btn btn-ghost" id="btn-show-new-subject" style="width:100%;">+ nueva materia</button>
      <div class="add-row" id="new-subject-row" hidden style="margin-top:8px;">
        <input type="text" id="new-subject-input" placeholder="Nombre de la materia">
        <button id="btn-confirm-subject">OK</button>
      </div>
    </div>
  </aside>
</main>

<footer>hecho para organizar tu rutina de estudio — los datos se guardan solo en este navegador</footer>

<script>
(function(){
  "use strict";

  var PALETTE = ['#2F6F62','#46618C','#C99A2E','#7A5980','#B5533C','#6B7A3A'];
  var WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var STORAGE_KEY = 'cronograma-app-state-v1';

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultState(){
    var s = {
      subjects: [
        { id: uid(), name:'Clínica Médica', color: PALETTE[0], topics:[
          {id:uid(), name:'Antiarrítmicos'},
          {id:uid(), name:'Antagonistas del canal de calcio'},
          {id:uid(), name:'Insuficiencia cardíaca'},
          {id:uid(), name:'Trastornos hidroelectrolíticos'}
        ]},
        { id: uid(), name:'Cirugía General', color: PALETTE[1], topics:[
          {id:uid(), name:'Abdomen agudo'},
          {id:uid(), name:'Hernias de la pared abdominal'},
          {id:uid(), name:'Trauma abdominal'}
        ]},
        { id: uid(), name:'Pediatría', color: PALETTE[2], topics:[
          {id:uid(), name:'Crecimiento y desarrollo'},
          {id:uid(), name:'Ictericia neonatal'},
          {id:uid(), name:'Enfermedades exantemáticas'}
        ]},
        { id: uid(), name:'Ginecología y Obstetricia', color: PALETTE[3], topics:[
          {id:uid(), name:'Sangrado uterino anormal'},
          {id:uid(), name:'Control prenatal de alto riesgo'},
          {id:uid(), name:'Climaterio'}
        ]}
      ],
      rangeStart: isoDate(new Date()),
      rangeEnd: isoDate(addDays(new Date(), 13)),
      schedule: {},
      collapsed: {}
    };
    return s;
  }

  function isoDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function parseISO(iso){
    var parts = iso.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.subjects) return defaultState();
      return parsed;
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function findSubject(id){ return state.subjects.find(function(s){ return s.id===id; }); }

  /* ---------------- RENDER ---------------- */

  function render(){
    renderSubjects();
    renderCalendar();
    save();
  }

  function renderSubjects(){
    var wrap = document.getElementById('subjects-list');
    wrap.innerHTML = '';
    state.subjects.forEach(function(subj){
      var box = document.createElement('div');
      box.className = 'subject';
      box.style.setProperty('--tag', subj.color);

      var head = document.createElement('div');
      head.className = 'subject-head';
      var collapsed = !!state.collapsed[subj.id];
      head.innerHTML =
        '<button class="icon-btn collapse-btn" data-action="toggle-subject" data-id="'+subj.id+'">'+(collapsed?'▸':'▾')+'</button>'+
        '<span class="dot"></span>'+
        '<span class="subject-name"></span>'+
        '<button class="icon-btn" data-action="add-topic-form" data-id="'+subj.id+'" title="Agregar tema">+</button>'+
        '<button class="icon-btn" data-action="delete-subject" data-id="'+subj.id+'" title="Eliminar materia">🗑</button>';
      head.querySelector('.subject-name').textContent = subj.name;
      box.appendChild(head);

      var list = document.createElement('div');
      list.className = 'topic-list' + (collapsed ? ' collapsed' : '');

      subj.topics.forEach(function(t){
        var chip = document.createElement('div');
        chip.className = 'topic-chip';
        chip.draggable = true;
        chip.dataset.subjectId = subj.id;
        chip.dataset.topicId = t.id;
        chip.style.setProperty('--tag', subj.color);
        var span = document.createElement('span');
        span.textContent = t.name;
        var del = document.createElement('button');
        del.textContent = '×';
        del.setAttribute('data-action','delete-topic');
        del.setAttribute('data-subject-id', subj.id);
        del.setAttribute('data-topic-id', t.id);
        chip.appendChild(span);
        chip.appendChild(del);
        list.appendChild(chip);
      });

      var addBtn = document.createElement('button');
      addBtn.className = 'subject-add-topic-btn';
      addBtn.textContent = '+ tema';
      addBtn.setAttribute('data-action','add-topic-form');
      addBtn.setAttribute('data-id', subj.id);
      list.appendChild(addBtn);

      var addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.id = 'add-topic-row-'+subj.id;
      addRow.hidden = true;
      addRow.innerHTML =
        '<input type="text" placeholder="Nuevo tema" id="add-topic-input-'+subj.id+'">'+
        '<button data-action="confirm-add-topic" data-id="'+subj.id+'">OK</button>';
      list.appendChild(addRow);

      box.appendChild(list);
      wrap.appendChild(box);
    });
  }

  function renderCalendar(){
    var area = document.getElementById('calendar-area');
    if(!state.rangeStart || !state.rangeEnd){
      area.innerHTML = '<div class="cal-empty"><b>define el período</b>Elige la fecha inicial y final arriba para armar el cronograma.</div>';
      return;
    }
    var start = parseISO(state.rangeStart);
    var end = parseISO(state.rangeEnd);
    if(end < start){
      area.innerHTML = '<div class="cal-empty"><b>período inválido</b>La fecha final debe ser posterior a la fecha inicial.</div>';
      return;
    }
    var days = [];
    var cur = start;
    var guard = 0;
    while(cur <= end && guard < 400){
      days.push(new Date(cur));
      cur = addDays(cur,1);
      guard++;
    }

    var grid = document.createElement('div');
    grid.id = 'calendar-grid';

    days.forEach(function(d, idx){
      var iso = isoDate(d);
      var card = document.createElement('div');
      card.className = 'day-card' + ((d.getDay()===0||d.getDay()===6) ? ' weekend':'');
      card.style.setProperty('--rot', ((idx%2===0)? '-0.5deg':'0.5deg'));

      var head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML =
        '<span class="day-date">'+String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+'</span>'+
        '<span class="day-weekday">'+WEEKDAYS[d.getDay()]+'</span>';
      card.appendChild(head);

      var drop = document.createElement('div');
      drop.className = 'day-drop';
      drop.dataset.date = iso;

      var items = state.schedule[iso] || [];
      if(items.length===0){
        var ph = document.createElement('div');
        ph.className = 'day-placeholder';
        ph.textContent = 'suelta un tema aquí';
        drop.appendChild(ph);
      } else {
        items.forEach(function(it){
          var pi = document.createElement('div');
          pi.className = 'placed-item';
          pi.style.setProperty('--tag', it.color);
          pi.innerHTML =
            '<span class="placed-subject"></span>'+
            '<span class="placed-topic"></span>'+
            '<button data-action="remove-item" data-date="'+iso+'" data-item-id="'+it.id+'">×</button>';
          pi.querySelector('.placed-subject').textContent = it.subjectName;
          pi.querySelector('.placed-topic').textContent = it.topicName;
          drop.appendChild(pi);
        });
      }

      card.appendChild(drop);
      grid.appendChild(card);
    });

    area.innerHTML = '';
    area.appendChild(grid);
  }

  /* ---------------- EVENTS ---------------- */

  document.getElementById('range-start').addEventListener('change', function(e){
    state.rangeStart = e.target.value; render();
  });
  document.getElementById('range-end').addEventListener('change', function(e){
    state.rangeEnd = e.target.value; render();
  });

  document.getElementById('btn-show-new-subject').addEventListener('click', function(){
    document.getElementById('new-subject-row').hidden = false;
    document.getElementById('new-subject-input').focus();
  });
  document.getElementById('btn-confirm-subject').addEventListener('click', addSubjectFromInput);
  document.getElementById('new-subject-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') addSubjectFromInput();
  });
  function addSubjectFromInput(){
    var input = document.getElementById('new-subject-input');
    var name = input.value.trim();
    if(!name) return;
    var color = PALETTE[state.subjects.length % PALETTE.length];
    state.subjects.push({id:uid(), name:name, color:color, topics:[]});
    input.value='';
    document.getElementById('new-subject-row').hidden = true;
    render();
  }

  // delegated clicks
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');

    if(action === 'toggle-subject'){
      var id = btn.dataset.id;
      state.collapsed[id] = !state.collapsed[id];
      render();
    }
    else if(action === 'delete-subject'){
      var id = btn.dataset.id;
      if(confirm('¿Eliminar esta materia y todos sus temas?')){
        state.subjects = state.subjects.filter(function(s){ return s.id!==id; });
        render();
      }
    }
    else if(action === 'add-topic-form'){
      var id = btn.dataset.id;
      var row = document.getElementById('add-topic-row-'+id);
      if(row){ row.hidden = false; document.getElementById('add-topic-input-'+id).focus(); }
    }
    else if(action === 'confirm-add-topic'){
      var id = btn.dataset.id;
      var input = document.getElementById('add-topic-input-'+id);
      var name = input.value.trim();
      if(name){
        var subj = findSubject(id);
        subj.topics.push({id:uid(), name:name});
        render();
      }
    }
    else if(action === 'delete-topic'){
      var sid = btn.dataset.subjectId, tid = btn.dataset.topicId;
      var subj = findSubject(sid);
      subj.topics = subj.topics.filter(function(t){ return t.id!==tid; });
      render();
    }
    else if(action === 'remove-item'){
      var date = btn.dataset.date, itemId = btn.dataset.itemId;
      if(state.schedule[date]){
        state.schedule[date] = state.schedule[date].filter(function(it){ return it.id!==itemId; });
      }
      render();
    }
  });

  // enter key inside dynamic topic inputs (delegated)
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.tagName==='INPUT' && e.target.id.indexOf('add-topic-input-')===0){
      var id = e.target.id.replace('add-topic-input-','');
      var subj = findSubject(id);
      var name = e.target.value.trim();
      if(name){ subj.topics.push({id:uid(), name:name}); render(); }
    }
  });

  // drag and drop
  document.addEventListener('dragstart', function(e){
    var chip = e.target.closest('.topic-chip');
    if(!chip) return;
    var sid = chip.dataset.subjectId, tid = chip.dataset.topicId;
    var subj = findSubject(sid);
    var topic = subj.topics.find(function(t){ return t.id===tid; });
    if(!topic) return;
    var payload = { subjectId: sid, subjectName: subj.name, topicId: tid, topicName: topic.name, color: subj.color };
    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'copy';
    chip.classList.add('dragging');
  });
  document.addEventListener('dragend', function(e){
    var chip = e.target.closest('.topic-chip');
    if(chip) chip.classList.remove('dragging');
  });
  document.addEventListener('dragover', function(e){
    var drop = e.target.closest('.day-drop');
    if(!drop) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    drop.classList.add('drag-over');
  });
  document.addEventListener('dragleave', function(e){
    var drop = e.target.closest('.day-drop');
    if(drop) drop.classList.remove('drag-over');
  });
  document.addEventListener('drop', function(e){
    var drop = e.target.closest('.day-drop');
    if(!drop) return;
    e.preventDefault();
    drop.classList.remove('drag-over');
    var raw = e.dataTransfer.getData('text/plain');
    if(!raw) return;
    var payload;
    try{ payload = JSON.parse(raw); }catch(err){ return; }
    var date = drop.dataset.date;
    if(!state.schedule[date]) state.schedule[date] = [];
    state.schedule[date].push({
      id: uid(),
      subjectId: payload.subjectId,
      subjectName: payload.subjectName,
      topicName: payload.topicName,
      color: payload.color
    });
    render();
  });

  /* ---------------- PDF ---------------- */

  function hexToRgb(hex){
    var v = hex.replace('#','');
    return [parseInt(v.substring(0,2),16), parseInt(v.substring(2,4),16), parseInt(v.substring(4,6),16)];
  }

  function fitText(doc, text, maxWidth){
    if(doc.getTextWidth(text) <= maxWidth) return text;
    var t = text;
    while(t.length > 1 && doc.getTextWidth(t + '…') > maxWidth){ t = t.slice(0,-1); }
    return t + '…';
  }

  // builds an array of weeks (Sun..Sat), each a list of {date|null} covering the full range,
  // padded at both ends so every week has 7 slots, like the on-screen grid but organized by week.
  function buildWeeks(start, end){
    var firstSunday = addDays(start, -start.getDay());
    var lastSaturday = addDays(end, 6 - end.getDay());
    var weeks = [];
    var cur = new Date(firstSunday);
    while(cur <= lastSaturday){
      var week = [];
      for(var i=0;i<7;i++){
        var inRange = cur >= start && cur <= end;
        week.push(inRange ? new Date(cur) : null);
        cur = addDays(cur,1);
      }
      weeks.push(week);
    }
    return weeks;
  }

  document.getElementById('btn-pdf').addEventListener('click', function(){
    if(!state.rangeStart || !state.rangeEnd){ alert('Define el período del cronograma antes de generar el PDF.'); return; }
    var start = parseISO(state.rangeStart), end = parseISO(state.rangeEnd);
    if(end < start){ alert('Período inválido.'); return; }

    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor){ alert('No se pudo cargar el generador de PDF. Verifica tu conexión a internet.'); return; }

    var doc = new jsPDFCtor({ unit:'pt', format:'a4', orientation:'landscape' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 34;
    var fmt = function(d){ return String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); };

    var colGap = 6;
    var colW = (pageW - margin*2 - colGap*6) / 7;
    var rowH = 132;
    var headerH = 16;
    var maxItemsShown = 4;
    var chipH = 21;
    var chipGap = 3;

    var weeks = buildWeeks(start, end);
    var weekIdx = 0;

    function drawTitleBlock(){
      var y = margin + 4;
      doc.setFont('helvetica','bold');
      doc.setFontSize(17);
      doc.setTextColor(35,40,31);
      doc.text('Cronograma de Estudios', margin, y);

      doc.setFont('helvetica','normal');
      doc.setFontSize(10);
      doc.setTextColor(90,96,86);
      doc.text(fmt(start) + '  —  ' + fmt(end), pageW - margin, y, {align:'right'});
      y += 16;

      // legend
      doc.setFontSize(8.5);
      var lx = margin;
      state.subjects.forEach(function(s){
        var rgb = hexToRgb(s.color);
        var w = doc.getTextWidth(s.name) + 16;
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        doc.roundedRect(lx, y-7, 7, 7, 2, 2, 'F');
        doc.setTextColor(35,40,31);
        doc.text(s.name, lx + 11, y);
        lx += w + 8;
      });
      y += 12;
      return y + 10;
    }

    function drawWeekdayHeader(y){
      var labels = ['dom','lun','mar','mié','jue','vie','sáb'];
      doc.setFont('helvetica','bold');
      doc.setFontSize(8);
      doc.setTextColor(120,126,112);
      for(var i=0;i<7;i++){
        var x = margin + i*(colW+colGap);
        doc.text(labels[i].toUpperCase(), x + 5, y);
      }
      return y + 8;
    }

    function drawWeekRow(week, y){
      for(var i=0;i<7;i++){
        var x = margin + i*(colW+colGap);
        var d = week[i];
        var isWeekend = (i===0 || i===6);

        // cell background
        if(!d){
          doc.setFillColor(238,238,233);
          doc.roundedRect(x, y, colW, rowH, 4, 4, 'F');
          continue;
        }
        doc.setFillColor(isWeekend ? 239 : 244, isWeekend ? 241 : 245, isWeekend ? 234 : 241);
        doc.roundedRect(x, y, colW, rowH, 4, 4, 'F');
        doc.setDrawColor(199,203,190);
        doc.setLineWidth(0.6);
        doc.roundedRect(x, y, colW, rowH, 4, 4, 'S');

        // date header
        doc.setFont('helvetica','bold');
        doc.setFontSize(9.5);
        doc.setTextColor(35,40,31);
        doc.text(String(d.getDate()).padStart(2,'0') + ' ' + MONTHS[d.getMonth()], x + 6, y + 14);

        // dashed divider
        doc.setDrawColor(210,213,201);
        doc.setLineDashPattern([1.5,1.5], 0);
        doc.line(x+4, y+headerH+3, x+colW-4, y+headerH+3);
        doc.setLineDashPattern([], 0);

        // items
        var iso = isoDate(d);
        var items = state.schedule[iso] || [];
        var iy = y + headerH + 8;
        var shown = items.slice(0, maxItemsShown);
        var chipX = x + 4;
        var chipW = colW - 8;
        shown.forEach(function(it){
          var rgb = hexToRgb(it.color);

          // card background + border
          doc.setFillColor(255,255,255);
          doc.roundedRect(chipX, iy, chipW, chipH, 2.5, 2.5, 'F');
          doc.setDrawColor(216,219,209);
          doc.setLineWidth(0.5);
          doc.roundedRect(chipX, iy, chipW, chipH, 2.5, 2.5, 'S');

          // colored left bar
          doc.setFillColor(rgb[0], rgb[1], rgb[2]);
          doc.rect(chipX + 0.3, iy + 0.3, 3, chipH - 0.6, 'F');

          var textX = chipX + 8;
          var textMaxW = chipW - 12;

          // subject name (top, small, gray, uppercase)
          doc.setFont('helvetica','normal');
          doc.setFontSize(5.8);
          doc.setTextColor(140,145,133);
          doc.text(fitText(doc, it.subjectName.toUpperCase(), textMaxW), textX, iy + 8);

          // topic name (bottom, bold)
          doc.setFont('helvetica','bold');
          doc.setFontSize(7.6);
          doc.setTextColor(35,40,31);
          doc.text(fitText(doc, it.topicName, textMaxW), textX, iy + 17);

          iy += chipH + chipGap;
        });
        if(items.length > maxItemsShown){
          doc.setFont('helvetica','italic');
          doc.setFontSize(7.2);
          doc.setTextColor(120,126,112);
          doc.text('+' + (items.length - maxItemsShown) + ' más', x + 6, iy + 6);
        }
      }
    }

    var y = drawTitleBlock();
    y = drawWeekdayHeader(y);

    weeks.forEach(function(week, idx){
      if(y + rowH > pageH - margin){
        doc.addPage();
        y = margin + 6;
        y = drawWeekdayHeader(y);
      }
      drawWeekRow(week, y);
      y += rowH + 8;
    });

    var fname = 'cronograma_' + state.rangeStart + '_a_' + state.rangeEnd + '.pdf';
    doc.save(fname);
  });

  /* ---------------- INIT ---------------- */

  document.getElementById('range-start').value = state.rangeStart || '';
  document.getElementById('range-end').value = state.rangeEnd || '';
  render();

})();
</script>
</body>
</html>
